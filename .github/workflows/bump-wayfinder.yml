name: Bump Wayfinder

# Opens (or updates) ONE PR moving WAYFINDER_REF to the newest stable Wayfinder
# release, or ONE issue when regeneration fails. User input, the tag, titles
# and error text never appear as ${{ }} expressions inside run: scripts; they
# reach the shell only through step env and reach gh as quoted variables/files.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Wayfinder stable release tag (vX.Y.Z); empty = newest stable tag
        required: false
        type: string

concurrency: bump-wayfinder

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GOTOOLCHAIN: auto

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      HAS_BUMP_APP: ${{ secrets.BUMP_APP_CLIENT_ID != '' && secrets.BUMP_APP_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '~1.11'
          terraform_wrapper: false

      # Short-lived, read-only token for the private Wayfinder source, minted
      # from the org GitHub App; no long-lived personal token is involved.
      - name: Mint Wayfinder read token
        id: wf-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ORG_ACTIONS_APP_ID }}
          private-key: ${{ secrets.ORG_ACTIONS_APP_SECRET }}
          owner: ${{ github.repository_owner }}
          repositories: wayfinder
          permission-contents: read

      - name: Resolve target tag
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          WAYFINDER_READ_TOKEN: ${{ steps.wf-token.outputs.token }}
        run: |
          tag="${INPUT_REF:-$(scripts/latest-wayfinder-tag.sh)}"
          if ! printf '%s\n' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a stable Wayfinder release tag (vX.Y.Z)"
            exit 1
          fi
          current="$(tr -d '[:space:]' < WAYFINDER_REF)"
          if scripts/semver-gt.sh "$tag" "$current"; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
          else
            echo "pinned $current is not older than $tag; nothing to do"
            echo "bump=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Regenerate provider
        id: bump
        if: steps.resolve.outputs.bump == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          WAYFINDER_READ_TOKEN: ${{ steps.wf-token.outputs.token }}
        run: |
          # The script's stderr can quote private Wayfinder source; keep it out
          # of the log, issues, artifacts and summaries. Only a sanitized
          # error.txt (fixed step name, run link, reproduce command) is published.
          set +e
          ./scripts/bump-wayfinder.sh "$TAG" 2> "$RUNNER_TEMP/bump-stderr.txt"
          rc=$?
          set -e
          rm -f error.txt
          if [ "$rc" -ne 0 ]; then
            step_line="$(grep -m1 -oE 'failed at step: .+$' "$RUNNER_TEMP/bump-stderr.txt" || true)"
            if [ -n "$step_line" ]; then
              detail=": ${step_line#failed at step: }"
            else
              detail=" before regeneration started"
            fi
            printf 'Bump to %s failed%s.\n\nDiagnostic output is withheld because it can quote private Wayfinder source.\nRun: %s/%s/actions/runs/%s\nReproduce locally (needs Wayfinder read access): make bump-wayfinder REF=%s\n' \
              "$TAG" "$detail" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TAG" > error.txt
            cat error.txt
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Minted after regeneration so the 1h token is fresh for the push, PR
      # and failure issue. App-authored pushes and PRs trigger CI; with no app
      # configured the steps below fall back to GITHUB_TOKEN.
      - name: Mint bump PR token
        id: pr-token
        if: ${{ !cancelled() && steps.resolve.outputs.bump == 'true' && env.HAS_BUMP_APP == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BUMP_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Open or update bump PR
        if: steps.bump.outcome == 'success'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          GH_TOKEN: ${{ steps.pr-token.outputs.token || secrets.GITHUB_TOKEN }}
          HAS_PR_TOKEN: ${{ steps.pr-token.outputs.token != '' }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch=chore/wayfinder-bump
          title="chore: bump Wayfinder to $TAG"
          cp bump-summary.md pr-body.md
          if [ "$HAS_PR_TOKEN" != "true" ]; then
            printf '\n---\nCI does not run automatically for this PR; close and reopen it to start checks.\n' >> pr-body.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A -- WAYFINDER_REF schema internal/generated docs examples
          git commit -m "$title"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push --force "https://github.com/$REPO.git" "HEAD:refs/heads/$branch"
          pr="$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number')"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$REPO" --title "$title" --body-file pr-body.md
          else
            gh pr create --repo "$REPO" --head "$branch" --base "$BASE" \
              --title "$title" --body-file pr-body.md
            pr="$(gh pr list --repo "$REPO" --head "$branch" --state open --json number --jq '.[0].number')"
          fi
          first_line=""; IFS= read -r first_line < bump-summary.md || true
          case "$first_line" in
            BREAKING*)
              gh label create breaking --repo "$REPO" --color B60205 --force >/dev/null
              gh pr edit "$pr" --repo "$REPO" --add-label breaking
              ;;
            *)
              gh pr edit "$pr" --repo "$REPO" --remove-label breaking >/dev/null 2>&1 || true
              ;;
          esac

      - name: Open or update failure issue
        if: failure() && steps.bump.outcome == 'failure'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          GH_TOKEN: ${{ steps.pr-token.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          title="Wayfinder $TAG: provider regeneration failed"
          if [ ! -s error.txt ]; then
            printf 'Bump to %s failed: unknown.\n\nDiagnostic output is withheld because it can quote private Wayfinder source.\nRun: %s/%s/actions/runs/%s\nReproduce locally (needs Wayfinder read access): make bump-wayfinder REF=%s\n' \
              "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TAG" > error.txt
          fi
          issue="$(gh issue list --repo "$REPO" --state open --limit 200 --json number,title \
            | jq -r --arg t "$title" 'map(select(.title == $t)) | .[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" --body-file error.txt
          else
            gh issue create --repo "$REPO" --title "$title" --body-file error.txt
          fi
