name: Acceptance

# Runs the TF_ACC acceptance tests against a real Wayfinder tenant, then sweeps leftovers.
# Prerequisite repository secrets: ACC_WAYFINDER_SERVER, ACC_WAYFINDER_TENANT,
# ACC_WAYFINDER_CLIENT_ID and ACC_WAYFINDER_CLIENT_SECRET (a service account client
# credential in the test tenant). Never runs for pull requests.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: acceptance
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  acceptance:
    if: github.repository == 'appvia/terraform-provider-wayfinder'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WAYFINDER_SERVER: ${{ secrets.ACC_WAYFINDER_SERVER }}
      WAYFINDER_TENANT: ${{ secrets.ACC_WAYFINDER_TENANT }}
      WAYFINDER_CLIENT_ID: ${{ secrets.ACC_WAYFINDER_CLIENT_ID }}
      WAYFINDER_CLIENT_SECRET: ${{ secrets.ACC_WAYFINDER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~> 1.11"
          terraform_wrapper: false
      - name: Acceptance tests
        run: TF_ACC=1 go test ./internal/acctest/... -run TestAcc -timeout 60m -v
      - name: Sweep leftovers
        if: always()
        run: go test ./internal/acctest/... -sweep=ci -timeout 15m
